<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Future Tech Academy | Add Slide</title>
    <link rel="icon" href="/images/logo.png" type="icon/image">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f8f9fa; }
        .card { border-radius: 15px; }
        /* Simple spinner style */
        .spinner-border { width: 1.2rem; height: 1.2rem; display: none; }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="mb-4 text-center">Add New Slide</h3>

                        <form id="postForm">
                            <div class="mb-3">
                                <label class="form-label">Slide Title</label>
                                <input type="text" id="title" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Slide Description</label>
                                <textarea id="description" class="form-control" rows="4"
                                    placeholder="Enter post description..." required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Slide Image (1080x1350 recommended)</label>
                                <input type="file" id="image" class="form-control" accept="image/*" required>
                            </div>

                            <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                                <span class="spinner-border spinner-border-sm" id="loader"></span>
                                <span id="btnText">Slide Now</span>
                            </button>
                        </form>

                        <div id="message" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/js/config.js"></script>
    <script>
        // Use a fallback in case config.js fails to load
        const API = (window.ENV && window.ENV.API_URL) ? window.ENV.API_URL : "";

        const postForm = document.getElementById("postForm");
        const submitBtn = document.getElementById("submitBtn");
        const loader = document.getElementById("loader");
        const btnText = document.getElementById("btnText");
        const messageDiv = document.getElementById("message");

        postForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            // 1. UI Loading State
            submitBtn.disabled = true;
            loader.style.display = "inline-block";
            btnText.innerText = " Uploading...";
            messageDiv.innerHTML = "";

            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const imageFile = document.getElementById("image").files[0];

            // 2. Prepare FormData
            const formData = new FormData();
            formData.append("Title", title);
            formData.append("Description", description);
            formData.append("Image", imageFile);

            try {
                const response = await fetch(API + "/slide", {
                    method: "POST",
                    headers: { 
                        // Do NOT set 'Content-Type': 'multipart/form-data' manually. 
                        // The browser must set it with the boundary string.
                        "authorization": localStorage.getItem("token") 
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = `<span class="text-success">Slide added successfully! Redirecting...</span>`;
                    setTimeout(() => {
                        window.location.href = "/admin-panel"; // Match your server.js route
                    }, 1500);
                } else {
                    throw new Error(result.message || "Failed to upload slide");
                }

            } catch (err) {
                console.error("Upload Error:", err);
                messageDiv.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
                
                // Reset button so user can try again
                submitBtn.disabled = false;
                loader.style.display = "none";
                btnText.innerText = "Slide Now";
            }
        });
    </script>
</body>
</html>
