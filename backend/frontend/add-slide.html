<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Future Tech Academy | Add Slide</title>
    <link rel="icon" href="/images/logo.png" type="icon/image">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            border-radius: 15px;
        }

        .preview-img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h3 class="mb-4 text-center">Add New Slide</h3>

                        <form id="postForm">

                            <!-- Title -->
                            <div class="mb-3">
                                <label class="form-label">Slide Title</label>
                                <input type="text" id="title" class="form-control" required>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label class="form-label">Slide Description</label>
                                <textarea id="description" class="form-control" rows="4"
                                    placeholder="Enter post description..." required></textarea>
                            </div>

                            <!-- Image -->
                            <div class="mb-3">
                                <label class="form-label">Slide Image (1080x1350 recommended)</label>
                                <input type="file" id="image" class="form-control" accept="image/*" required>
                            </div>

                            <!-- Submit -->
                            <button type="submit" class="btn btn-primary w-100">
                                Slide Now
                            </button>

                        </form>

                        <div id="message" class="mt-3 text-center"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <script src="/js/config.js"></script>
    <script>

        const API = window.ENV.API_URL;

        // FORM SUBMIT
        document.getElementById("postForm").addEventListener("submit", function (e) {
            e.preventDefault()

            const title = document.getElementById("title").value.trim()
            const description = document.getElementById("description").value.trim()
            const image = document.getElementById("image").files[0]

            const formData = new FormData()
            formData.append("Title", title)
            formData.append("Description", description)
            formData.append("Image", image)

            fetch(API + "/slide", {
                method: "POST",
                headers: { authorization: localStorage.getItem("token") },
                body: formData
            })
                .then((res) => {
                    location.href = "/admin.html"
                }).catch((err) => {
                    alert(err)

                })



        })

    </script>

</body>

</html>
