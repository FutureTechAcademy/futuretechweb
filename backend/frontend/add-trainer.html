<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Future Tech Academy | Add-Trainer</title>
    <link rel="icon" href="/images/logo.png" type="icon/image">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h3 class="mb-4 text-center">Add New Trainer</h3>

                        <form id="trainerForm">

                            <!-- Name -->
                            <div class="mb-3">
                                <label class="form-label">Trainer Name</label>
                                <input type="text" id="name" class="form-control" required>
                            </div>

                            <!-- Role -->
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <input type="text" id="role" class="form-control" placeholder="Example: Software Trainer" required>
                            </div>

                            <!-- Skills -->
                            <div class="mb-3">
                                <label class="form-label">Skills (Comma Separated)</label>
                                <textarea id="skills" class="form-control" rows="3"
                                    placeholder="Example: Java, Python, AI & ML" required></textarea>
                            </div>

                            <!-- Experience -->
                            <div class="mb-3">
                                <label class="form-label">Experience (Years)</label>
                                <input type="number" id="experience" class="form-control" required>
                            </div>

                            <!-- Photo -->
                            <div class="mb-3">
                                <label class="form-label">Trainer Photo (1080x1350 recommended)</label>
                                <input type="file" id="photo" class="form-control" accept="image/*" required>
                            </div>

                            <!-- Submit -->
                            <button type="submit" class="btn btn-primary w-100">
                                Post Trainer
                            </button>

                        </form>

                        <div id="message" class="mt-3 text-center"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>

        const API = window.ENV.API_URL;

        document.getElementById("trainerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const role = document.getElementById("role").value.trim();
            const skillsInput = document.getElementById("skills").value.trim();
            const experience = document.getElementById("experience").value.trim();
            const photoFile = document.getElementById("photo").files[0];

            // Convert skills string to array
            const skills = skillsInput.split(",").map(s => s.trim());

            const formData = new FormData();
            formData.append("Name", name);
            formData.append("Role", role);
            formData.append("Experience", experience);
            formData.append("Photo", photoFile);

            // Append skills as array
            skills.forEach(skill => {
                formData.append("Skills", skill);
            });

            fetch(API + "/trainer", {
                method: "POST",
                headers: { authorization: localStorage.getItem("token") },
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    window.location.href = "admin.html";
                })
                .catch(error => {
                    console.error(error);
                    alert("Something went wrong!");
                });

        });

    </script>

</body>

</html>
