<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Future Tech Academy | Add-Project</title>
    <link rel="icon" href="/images/logo.png" type="icon/image">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h3 class="mb-4 text-center">Add New Project</h3>

                        <form id="projectForm">

                            <!-- Title -->
                            <div class="mb-3">
                                <label class="form-label">Project Title</label>
                                <input type="text" id="title" class="form-control" required>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label class="form-label">Project Description</label>
                                <textarea id="description" class="form-control" rows="4"
                                    placeholder="below 300 letters" required></textarea>
                            </div>

                            <!-- Technologies -->
                            <div class="mb-3">
                                <label class="form-label">Technologies (Comma Separated)</label>
                                <textarea id="technologies" class="form-control" rows="3"
                                    placeholder="Example: HTML, CSS, JavaScript, Node.js" required></textarea>
                            </div>

                            <!-- Image -->
                            <div class="mb-3">
                                <label class="form-label">Project Image (1920x1080 recommended)</label>
                                <input type="file" id="image" class="form-control" accept="image/*" required>
                            </div>

                            <!-- Submit -->
                            <button type="submit" class="btn btn-primary w-100">
                                Post Project
                            </button>

                        </form>

                        <div id="message" class="mt-3 text-center"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>

        const API = window.ENV.API_URL;

        document.getElementById("projectForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const technologiesInput = document.getElementById("technologies").value.trim();
            const imageFile = document.getElementById("image").files[0];

            // Convert technologies string to array
            const technologies = technologiesInput.split(",").map(t => t.trim());

            const formData = new FormData();
            formData.append("Title", title);
            formData.append("Description", description);
            formData.append("Image", imageFile);

            // Append technologies as array
            technologies.forEach(tech => {
                formData.append("Technologies", tech);
            });

            fetch(API + "/project", {
                method: "POST",
                headers: { authorization: localStorage.getItem("token") },
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    window.location.href = "admin.html";
                })
                .catch(error => {
                    console.error(error);
                    alert("Something went wrong!");
                });

        });

    </script>

</body>

</html>
