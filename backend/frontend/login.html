<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="icon" href="/images/logo.png" type="icon/image">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .login-box {
            background: #ffffff;
            padding: 40px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 25px;
            color: #333;
        }

        .input-box {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-box label {
            font-size: 14px;
            color: #555;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #2a5298;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #2a5298;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1e3c72;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        .success {
            color: green;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Admin Login</h2>
        <form>
            <div class="input-box">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn">Login</button>
            <div id="message"></div>
        </form>
    </div>

    <script src="/js/config.js"></script>
    <script>

        document.querySelector("form").addEventListener("submit", Login);

        function Login(evt) {
            evt.preventDefault()
            const user = document.getElementById("username");
            const pass = document.getElementById("password");
            const message = document.getElementById("message");
            const API = window.ENV.API_URL

            fetch(API + "/admin", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ Name: user.value, Pass: pass.value })
            }
            )
                .then((res) => res.json())
                .then((data) => {
                
                  if(!data.token)
                  {
                    message.innerHTML = "<div class='error'>Invalid Username or Password</div>"
                  }
                  else{
                    localStorage.setItem("token",data.token)
                    window.location.href="admin.html"
                  }
                }

                )
                .catch((err) =>{if(err)message.innerHTML = "<div class='error'>Invalid Username or Password</div>"})

            // message.innerHTML = "<div class='success'>Login Successful!</div>";

            // message.innerHTML = "<div class='error'>Invalid Username or Password</div>";
          user.value=""
          pass.value=""
        }
    </script>

</body>

</html>
